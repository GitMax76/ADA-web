name: Validate consolidation beta
on:
  push:
    branches: [beta/consolidamento]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consolidation-beta
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/beta/consolidamento'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: ADA-beta-build
          path: dist/
          retention-days: 14
